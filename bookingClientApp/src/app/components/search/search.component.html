<h1 class="title">Αναζήτηση δωματίων</h1>

<div class="searchForm">

	<mat-form-field class="mat-form-field">
		<mat-label>Τοποθεσία</mat-label>
		<input matInput [matAutocomplete]="auto" [formControl]="cityForm" aria-label="Πόλη">
		<mat-autocomplete #auto="matAutocomplete">
			<mat-option *ngFor="let option of filtredCities | async" [value]="option.name">
				<span>{{option.name}}</span>
			</mat-option>
		</mat-autocomplete>
	</mat-form-field>

	<mat-form-field class="mat-form-field">
		<mat-label>Ημερομηνίες</mat-label>
		<mat-date-range-input [rangePicker]="picker" [min]="today">
			<input matStartDate placeholder="Start date" [(ngModel)]="startDate">
			<input matEndDate placeholder="End date" [(ngModel)]="endDate">
		</mat-date-range-input>
		<mat-hint>DD/MM/YYYY – DD/MM/YYYY</mat-hint>
		<mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
		<mat-date-range-picker #picker></mat-date-range-picker>
	</mat-form-field>

	<mat-form-field class="mat-form-field">
		<mat-label>Αριθμός Ατόμων</mat-label>
		<input matInput type="number" [(ngModel)]="numPersons" name="numPersons">
	</mat-form-field>

	<br/>

	<button mat-raised-button class="button" (click)="searchRooms()">Search</button>

</div>

<mat-card *ngFor="let room of rooms; let roomIndex = index;" class="card">
	<mat-card-header>
		<mat-card-title> {{ room.description}} </mat-card-title>
	</mat-card-header>
	<img [src]="defaultRoomImages[roomIndex]">
	<mat-card-content>
		<div> Room id: {{ room.id}} Price Per Night: {{ room.basePricePerNight }} </div>
	</mat-card-content>
	<mat-card-actions>
		<button mat-raised-button (click)="reserveRoom(roomIndex)">Λεπτομέριες δωματίου</button>
	</mat-card-actions>
</mat-card>
